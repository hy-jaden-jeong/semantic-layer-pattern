semantic_model:
  name: shop_kpi_daily
  description: 쇼핑몰 일일 운영 KPI. 일자 × 지표(long). 판매자 차원이 없다. 값은 이미 집계돼 있다. 값이 0인 날은 그 지표의 row가 없다(row가 없으면 0). 데이터가 어디까지 들어왔는지는 그 지표의 마지막 row가 아니라 table 전체의 MAX(event_date)로 본다. 단, metric caveats가 측정 안 되는 기간을 적었으면 그 기간은 0이 아니라 측정 안 됨이다. 비율은 ratio metric(order_cancel_rate)으로 둔다.
  node_relation:
    database: '`dev-shop-bi-catalog`'
    schema_name: gold
    alias: shop_kpi_daily
  defaults:
    agg_time_dimension: event_date
  primary_entity: shop_kpi_daily_row
  dimensions:
  - name: event_date
    type: time
    description: 지표 일자(KST). 일말 스냅샷 지표(_eod)는 그날 일말 기준이다.
    type_params:
      time_granularity: day
  - name: category
    type: categorical
    description: 지표 묶음. 대시보드 탭과 1:1이 아니다. 탭을 물으면 category가 아니라 대시보드 dataset을 본다.
    config:
      meta:
        shop:
          values:
          - overview
          - order
          - delivery
          - snapshot
  - name: metric
    type: categorical
    description: 지표 code. long table의 key다.
  measures:
  - name: shop_kpi_daily_value
    description: 날짜를 넘어 더할 수 있는 건수·금액.
    agg: sum
    expr: value
    config:
      meta:
        shop:
          rollup: sum
  - name: shop_kpi_daily_value_eod
    description: 일말 스냅샷. 기간을 물으면 마지막 날 값을 쓴다.
    agg: sum
    expr: value
    non_additive_dimension:
      name: event_date
      window_choice: max
    config:
      meta:
        shop:
          rollup: last
  - name: shop_kpi_daily_value_distinct
    description: 이미 중복을 뺀 수. 저장된 grain(하루) 밖으로 더하지 않는다.
    agg: sum
    expr: value
    non_additive_dimension:
      name: event_date
      window_choice: max
    config:
      meta:
        shop:
          rollup: none
  - name: shop_kpi_daily_value_stat
    description: 하루 단위로 이미 계산한 평균·백분위. 날짜를 넘어 더하거나 다시 평균하지 않는다.
    agg: sum
    expr: value
    non_additive_dimension:
      name: event_date
      window_choice: max
    config:
      meta:
        shop:
          rollup: none
  config:
    meta:
      shop:
        metric_prefix: ''
        shape: long
        long:
          key: metric
          value: value
        grain:
        - event_date
        - metric
        defined_in: src/aggregation/commerce/gold_shop_kpi_daily.sql
        rules:
          kst: applied
          exclude_internal: not_applied
          latest_snapshot: na
