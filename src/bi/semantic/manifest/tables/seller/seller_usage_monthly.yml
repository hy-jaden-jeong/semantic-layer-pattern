semantic_model:
  name: seller_usage_monthly
  description: 판매자 × 월 × 지표 사용량(long view). 내부·테스트 판매자는 view 안에서 뺐다. search 출처는 search_metric_monthly를 상점 → 판매자로 모아 센다.
  node_relation:
    database: '`dev-shop-bi-catalog`'
    schema_name: gold
    alias: seller_usage_monthly
  defaults:
    agg_time_dimension: event_month
  primary_entity: seller_usage_monthly_row
  entities:
  - name: seller
    type: foreign
    expr: seller_id
  dimensions:
  - name: event_month
    type: time
    type_params:
      time_granularity: month
    description: 집계월(KST). yyyy-MM 문자열이다.
    config:
      meta:
        shop:
          format: yyyy-MM
  - name: metric_source
    type: categorical
    description: 지표 출처.
    config:
      meta:
        shop:
          values:
          - order
          - cs
          - search
  - name: metric
    type: categorical
    description: 지표 code. long table의 key다. search 출처 code는 search_metric_monthly의 code를 그대로 쓴다.
  measures:
  - name: seller_usage_monthly_value
    description: 월을 넘어 더할 수 있는 건수·합계.
    agg: sum
    expr: value
    config:
      meta:
        shop:
          rollup: sum
  - name: seller_usage_monthly_value_distinct
    description: 그달 안에서 이미 중복을 뺀 수(주문이 있었던 날 수). 월을 넘어 더하지 않는다.
    agg: sum
    expr: value
    non_additive_dimension:
      name: event_month
      window_choice: max
    config:
      meta:
        shop:
          rollup: none
  - name: seller_usage_monthly_active_sellers
    description: 질의 때 세는 판매자 수. 값이 0보다 큰 row의 seller_id를 중복 없이 센다.
    agg: count_distinct
    expr: CASE WHEN value > 0 THEN seller_id END
    config:
      meta:
        shop:
          rollup: none
  config:
    meta:
      shop:
        metric_prefix: 'su_'
        shape: long
        long:
          key: metric
          value: value
          inherits:
          - search_metric_monthly
        grain:
        - seller_id
        - event_month
        - metric
        defined_in: src/aggregation/seller/gold_seller_usage_monthly.sql
        rules:
          kst: applied
          exclude_internal: applied
          latest_snapshot: na
