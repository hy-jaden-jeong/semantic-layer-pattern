semantic_model:
  name: search_metric_monthly
  description: 상점 내 검색 사용량. 월 × 상점 × 검색 사용자 × 지표(long). 지표 code는 seed(ref.search_metric_rules)가 정한다. 검색 로그는 회원 번호가 아니라 user_key를 남기므로 로그인 기준 회원 수와 더하거나 견주지 않는다.
  node_relation:
    database: '`dev-shop-bi-catalog`'
    schema_name: gold
    alias: search_metric_monthly
  defaults:
    agg_time_dimension: event_month
  primary_entity: search_metric_monthly_row
  entities:
  - name: store
    type: foreign
    expr: store_id
  - name: search_user
    type: foreign
    expr: user_key
  dimensions:
  - name: event_month
    type: time
    type_params:
      time_granularity: month
    description: 집계월(KST). yyyy-MM 문자열이다.
    config:
      meta:
        shop:
          format: yyyy-MM
  - name: metric
    type: categorical
    description: 지표 code. long table의 key다. seed가 정한다.
  - name: metric_label
    type: categorical
    description: 지표 이름. metric과 1:1이다.
  measures:
  - name: search_metric_monthly_cnt
    description: 검색 건수. 월·상점·사용자를 넘어 더할 수 있다.
    agg: sum
    expr: cnt
    config:
      meta:
        shop:
          rollup: sum
  - name: search_metric_monthly_users
    description: 질의 때 세는 검색 사용자 수. user_key를 중복 없이 센다.
    agg: count_distinct
    expr: user_key
    config:
      meta:
        shop:
          rollup: none
  config:
    meta:
      shop:
        metric_prefix: 'search_'
        shape: long
        long:
          key: metric
          value: cnt
          seed: src/aggregation/search/search_metric_rules.sql
        grain:
        - event_month
        - store_id
        - user_key
        - metric
        defined_in: src/aggregation/search/gold_search_metric_monthly.sql
        rules:
          kst: applied
          exclude_internal: not_applied
          latest_snapshot: na
