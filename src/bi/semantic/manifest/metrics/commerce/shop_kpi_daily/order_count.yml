metric:
  name: order_count
  label: 주문 수
  description: 그날(KST) 들어온 주문 건수. 취소된 주문도 주문일에 그대로 센다.
  type: simple
  type_params:
    measure: shop_kpi_daily_value
  filter: "{{ Dimension('shop_kpi_daily_row__metric') }} = 'order_count'"
  config:
    meta:
      shop:
        kind: count
        unit: 건
        status: confirmed
        docs:
        - wiki.metric-criteria
