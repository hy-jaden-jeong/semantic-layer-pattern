metric:
  name: wau
  label: WAU(최근 7일 로그인 회원 수)
  description: 그날을 포함한 최근 7일(KST)에 로그인 기록이 1건 이상인 회원 수. 달력 주가 아니라 rolling 창이다.
  type: simple
  type_params:
    measure: shop_kpi_daily_value_distinct
  filter: "{{ Dimension('shop_kpi_daily_row__metric') }} = 'wau'"
  config:
    meta:
      shop:
        kind: distinct_count
        counts: member
        unit: 회원
        status: confirmed
        docs:
        - wiki.metric-criteria
