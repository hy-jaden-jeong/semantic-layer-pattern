name: shop_bi
version: "1.0.0"
config-version: 2
profile: shop_bi

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["data_tests"]      # tests/는 pytest가 쓴다(semantic layer 검사)

# layer마다 schema 하나. macros/generate_schema_name.sql이 이 이름을 그대로 schema로 쓴다.
# semantic layer(semantic/)는 mart schema의 model만 정의한다. semantic/catalog.py가 같은 대응(models/marts → mart)을 쓴다.
models:
  shop_bi:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: mart

seeds:
  shop_bi:
    raw:
      +schema: raw
    ref:
      +schema: ref
